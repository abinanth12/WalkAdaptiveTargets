
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Walk-Adaptive Targets</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <h1>Walk-Adaptive Targets</h1>
      <p>CSE 518 - Touchscreen Interaction Study</p>
    </header>

    <section class="controls">
      <label for="mode">Interface Mode</label>
      <select id="mode">
        <option value="fixed">Fixed Targets</option>
        <option value="adaptive">Adaptive Targets</option>
      </select>

      <label for="posture">Activity</label>
      <select id="posture">
        <option value="sitting">Sitting</option>
        <option value="walking">Walking</option>
      </select>

      <button id="startBtn">Start Experiment</button>
    </section>

    <section class="stats">
      <div>Trial: <strong id="trial">0/20</strong></div>
      <div>Hits: <strong id="hits">0</strong></div>
      <div>Misses: <strong id="misses">0</strong></div>
      <div>Average: <strong id="avgTime">0 ms</strong></div>
    </section>

    <div id="gameArea" aria-label="Tap testing area">
      <p id="instruction">
        Select a mode and activity, then press Start.
      </p>
    </div>

    <p id="status" role="status">Ready to begin.</p>

    <button id="downloadBtn" disabled>
      Download Results (CSV)
    </button>
  </main>
</body>
</html>
